name: tests

# Corre la suite completa (todos los modulos, ver pytest.ini) en cada push y
# PR, en cualquier rama de trabajo. gh-pages queda fuera: solo lleva los
# tableros publicados, no el codigo.
# Ninguno de estos tests toca datos financieros reales -- todos construyen
# workbooks sinteticos en tmp_path (ver pytest.ini) -- asi que este workflow
# no necesita ni puede acceder a los archivos reales de Centro de Costos
# (viven solo en el OneDrive local del usuario, nunca en este repo).
#
# Hasta el 2026-10-08 corria solo en master (el trabajo vive en otras ramas)
# y fallaba desde el 2026-08-26 porque no instalaba Chromium: la prueba de
# los reportes PDF (Reportes/motor_reportes.py) lo necesita.

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Chromium (reportes PDF)
        run: python -m playwright install chromium

      - name: Correr la suite completa
        run: python -m pytest -q
