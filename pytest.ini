[pytest]
# Config unica para las 7 suites del repo (Centro de Costos, Cotizador
# Historico, Sistema Analisis Financiero -- cada uno con Sistema/ y/o
# Visualizador Web/ y Reportes/). Antes de esto, correr pytest sobre todo el
# repo abortaba con 7 errores de recoleccion y solo se podia testear carpeta
# por carpeta -- por ese hueco se colo una divergencia real entre el KPI
# "Nota del Proyecto" del visualizador y el del Excel/PDF (auditoria
# 2026-07-28).
#
# Correr todo:  py -3.14 -m pytest
# (ver requirements.txt: el "python" del PATH es 3.11 y no tiene openpyxl)

# Los 3 modulos tienen un "Visualizador Web/tests/test_build_visualizador.py"
# cada uno. Con el import-mode clasico ("prepend") pytest los registra en
# sys.modules por nombre de archivo y el segundo choca con el primero.
# "importlib" no usa sys.modules por basename, asi que conviven sin
# necesidad de __init__.py ni de renombrarlos.
#
# OJO: esto resuelve la colision de los ARCHIVOS DE TEST. La colision de los
# MODULOS FUENTE que importan (los 3 "build_visualizador.py") se resuelve en
# cada test cargandolos por ruta bajo un nombre unico -- ver la nota en
# Centro de Costos/Visualizador Web/tests/test_build_visualizador.py.
addopts = --import-mode=importlib

# No se usa "testpaths": pytest la separa por espacios en blanco, y los 3
# modulos tienen espacios en el nombre ("Centro de Costos" se partiria en 3
# rutas inexistentes). Se recolecta recursivamente desde la raiz y se acota
# con norecursedirs.
#
# Los patrones se comparan contra el NOMBRE de cada carpeta (fnmatch sobre el
# basename), nunca contra la ruta completa: por eso va "worktrees" y no
# ".claude/worktrees". Se repiten los defaults de pytest que se pierden al
# sobrescribir esta opcion (".*", "build", "dist", "node_modules", "venv").
norecursedirs =
    .*
    worktrees
    *backup_*
    *output_final_*
    __pycache__
    build
    data
    dist
    node_modules
    venv
    Legado
    Respaldos
    Facturas y Boletas
    Sitio de comunicación*
